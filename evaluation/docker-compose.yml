name: rag-evaluation
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${EVAL_MYSQL_ROOT_PASSWORD:?Set EVAL_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: rag_evaluation
      MYSQL_USER: rag_eval
      MYSQL_PASSWORD: ${EVAL_MYSQL_PASSWORD:?Set EVAL_MYSQL_PASSWORD}
    volumes:
      - eval_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    volumes:
      - eval_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  rag:
    build:
      context: ..
      dockerfile: evaluation/Dockerfile
    environment:
      EVALUATION_ISOLATED: "1"
      EVALUATION_CACHE_DIR: /app/cache
      EVALUATION_MYSQL_HOST: mysql
      EVALUATION_REDIS_HOST: redis
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: rag_evaluation
      MYSQL_USER: rag_eval
      MYSQL_PASSWORD: ${EVAL_MYSQL_PASSWORD:?Set EVAL_MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:?Set DEEPSEEK_MODEL explicitly}
      EVALUATION_LLM_NON_THINKING: "1"
      EVALUATION_LLM_MAX_TOKENS: "800"
      EVALUATION_LLM_MAX_CALLS: "132"
      EVALUATION_LLM_BUDGET_CNY: "1.50"
      EVALUATION_LLM_INPUT_CNY_PER_MTOK: "2"
      EVALUATION_LLM_OUTPUT_CNY_PER_MTOK: "8"
    ports:
      - "127.0.0.1:${EVAL_API_PORT:-18080}:8000"
    volumes:
      - type: volume
        source: eval_index
        target: /app/cache
        volume:
          nocopy: true
      - eval_model_cache:/root/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "evaluation_app:app", "--host", "0.0.0.0", "--port", "8000"]
volumes:
  eval_mysql:
  eval_redis:
  eval_index:
  eval_model_cache:
