name: rag-v3-milvus
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
    volumes: [etcd:/etcd]
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    command: minio server /minio_data
    environment:
      MINIO_ROOT_USER: ${RAG_MILVUS_MINIO_USER:?required}
      MINIO_ROOT_PASSWORD: ${RAG_MILVUS_MINIO_PASSWORD:?required}
    volumes: [minio:/minio_data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
  standalone:
    image: milvusdb/milvus:v2.6.25
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${RAG_MILVUS_MINIO_USER:?required}
      MINIO_SECRET_ACCESS_KEY: ${RAG_MILVUS_MINIO_PASSWORD:?required}
      MINIO_REGION: us-east-1
    ports: ['127.0.0.1:${RAG_DOCKER_MILVUS_PORT:-19531}:19530','127.0.0.1:${RAG_DOCKER_MILVUS_HEALTH_PORT:-19091}:9091']
    volumes: [milvus:/var/lib/milvus]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 10
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: unless-stopped
volumes:
  etcd: {}
  minio: {}
  milvus: {}
networks:
  default: {}
