services:
  rag-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-backend:latest
    container_name: rag-backend-container
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env.compose
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rag-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: rag-frontend:latest
    container_name: rag-frontend-container
    ports:
      - "127.0.0.1:8503:8501"
    env_file:
      - .env.frontend
    depends_on:
      rag-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysql:
    image: mysql:8.0
    container_name: rag-mysql-container
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rag_demo
    volumes:
      - rag_mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    container_name: rag-redis-container
    volumes:
      - rag_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  rag_mysql_data:
  rag_redis_data:
  hf_cache:
